<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The link that will trigger the popup -->
  <a href="#" id="showPageLink" class="showPageLink">Click here to be my Valentine 💖</a>

  <!-- The hidden pink page that shows when the link is clicked -->
  <div id="valentinePage" class="valentinePage">
    <div class="container">
      <h1>Will You Be My Valentine?</h1>
      <p class="message">I can't imagine spending this Valentine's Day without you. 💖</p>
      <button id="yesButton" class="answerBtn">Yes, of course! 💌</button>
      <button id="noButton" class="answerBtn">Sorry, not this year 😔</button>
      <div id="responseMessage" class="responseMessage"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
